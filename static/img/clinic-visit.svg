<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"
     aria-label="Illustration of a clinician talking with a patient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2fc"/>
      <stop offset="1" stop-color="#d3e6fb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7dcf3"/>
      <stop offset="1" stop-color="#bcd4ef"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="95" fill="#cfe0f5" opacity="0.6"/>
  <circle cx="150" cy="360" r="70" fill="#cfe0f5" opacity="0.5"/>

  <!-- Window -->
  <rect x="70" y="70" width="230" height="150" rx="10" fill="#eaf4ff" stroke="#b9d3ef" stroke-width="4"/>
  <line x1="185" y1="70" x2="185" y2="220" stroke="#b9d3ef" stroke-width="4"/>
  <line x1="70" y1="145" x2="300" y2="145" stroke="#b9d3ef" stroke-width="4"/>

  <!-- Potted plant -->
  <rect x="1040" y="330" width="70" height="70" rx="8" fill="#e0906a"/>
  <path d="M1075 330 C1055 285 1035 285 1030 300 C1050 300 1058 315 1075 330 Z" fill="#4f9d6b"/>
  <path d="M1075 330 C1095 280 1120 285 1122 305 C1100 302 1092 315 1075 330 Z" fill="#5fb27c"/>

  <!-- Floor -->
  <rect x="0" y="400" width="1200" height="80" fill="url(#floor)"/>

  <!-- Clinician (left, standing, white coat) -->
  <g>
    <!-- coat -->
    <path d="M470 250 q80 -30 160 0 l24 150 q-104 30 -208 0 Z" fill="#ffffff" stroke="#d8e0ea" stroke-width="3"/>
    <!-- shirt / lapels -->
    <path d="M550 232 L520 400 L580 400 L550 232 Z" fill="#eef4fb"/>
    <path d="M550 232 L534 300 L550 320 L566 300 Z" fill="#8fb7e6"/>
    <!-- neck -->
    <rect x="536" y="205" width="28" height="30" rx="10" fill="#e0b48a"/>
    <!-- head -->
    <circle cx="550" cy="176" r="42" fill="#e8bd93"/>
    <!-- hair -->
    <path d="M508 176 q0 -48 42 -48 q42 0 42 48 q-16 -22 -42 -22 q-26 0 -42 22 Z" fill="#3a2e28"/>
    <!-- stethoscope -->
    <path d="M520 236 q-14 60 20 96" fill="none" stroke="#124f93" stroke-width="6" stroke-linecap="round"/>
    <path d="M580 236 q14 46 -8 78" fill="none" stroke="#124f93" stroke-width="6" stroke-linecap="round"/>
    <circle cx="548" cy="342" r="12" fill="#1a6dcc"/>
  </g>

  <!-- Patient (right, seated, orange top) -->
  <g>
    <!-- stool -->
    <rect x="742" y="360" width="96" height="16" rx="8" fill="#a9c4e6"/>
    <rect x="752" y="376" width="12" height="34" fill="#9bb8de"/>
    <rect x="816" y="376" width="12" height="34" fill="#9bb8de"/>
    <!-- legs -->
    <rect x="760" y="352" width="26" height="60" rx="12" fill="#3a4a5e"/>
    <rect x="794" y="352" width="26" height="60" rx="12" fill="#3a4a5e"/>
    <!-- orange top -->
    <path d="M744 300 q46 -34 92 0 l10 66 q-56 22 -112 0 Z" fill="#e8833a"/>
    <!-- arm -->
    <path d="M748 312 q-16 40 6 66" fill="none" stroke="#e8833a" stroke-width="26" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="776" y="266" width="26" height="28" rx="9" fill="#7a5334"/>
    <!-- head -->
    <circle cx="789" cy="240" r="40" fill="#82562f"/>
    <!-- hair -->
    <path d="M749 240 q0 -46 40 -46 q40 0 40 46 q-6 -14 -14 -18 q-10 22 -34 22 q-18 0 -24 -14 q-6 4 -8 10 Z" fill="#231913"/>
  </g>
</svg>
