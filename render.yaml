# Render blueprint: deploy this app as a free web service.
# In Render, choose "New +" -> "Blueprint" and point it at this repo.
services:
  - type: web
    name: clinical-trial-summarizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
